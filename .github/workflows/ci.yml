name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::unformatted files:"; echo "$out"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./internal/... ./migrations/...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # PostgreSQL is built locally because the image needs pg_partman, which
      # the stock postgres:17 image does not ship.
      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis

      - name: Run integration tests
        env:
          TEST_POSTGRES_URL: postgres://hoodalpha:hoodalpha@localhost:5432/hoodalpha?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
          # Chain tests are skipped without an endpoint. Set TEST_RH_RPC_URL as
          # a repository secret to exercise them against a real RPC provider.
          TEST_RH_RPC_URL: ${{ secrets.TEST_RH_RPC_URL }}
          TEST_RH_WS_URL: ${{ secrets.TEST_RH_WS_URL }}
          TEST_RH_CHAIN_ID: "4663"
        run: go test -count=1 -timeout 15m ./tests/integration/...

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
